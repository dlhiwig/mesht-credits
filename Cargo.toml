[package]
name = "mesht-credits"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
